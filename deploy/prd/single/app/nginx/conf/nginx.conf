worker_processes auto;
worker_rlimit_nofile 65535;

events {
    use epoll;
    worker_connections 65535;
    multi_accept on;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100m;

    upstream lien-gateway {
        server frameworkjava-gateway:18080;
        keepalive 100;
    }

    server {
        listen 80;
        server_name "";

        # 1. 静态构建产物目录 (/assets/)
        # Vite 构建产物带有文件名哈希，长期强缓存；缺失直接返回 404，严禁回退至 index.html
        location ^~ /assets/ {
            root /data/frameworkjava/web/dist;
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 根目录图标等单文件静态资源，缺失直接返回 404
        location = /favicon.ico {
            root /data/frameworkjava/web/dist;
            try_files $uri =404;
            access_log off;
            log_not_found off;
        }

        # 2. 同源 API 代理 (/api/)
        # 将前端 /api/ 请求代理转发至后端网关 /admin/
        location ^~ /api/ {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://lien-gateway/admin/;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 兼容无末尾斜杠的 /api 请求，重定向至 /api/
        location = /api {
            return 308 /api/;
        }

        # 3. 后端微服务原生路由代理 (/admin/ /file/ /portal/)
        location ~* ^/(admin/|file/|portal/) {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://lien-gateway;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 4. 前端单页应用路由回退 (HTML5 History 模式)
        location / {
            root /data/frameworkjava/web/dist;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Headers *;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods *;
        }
    }
}
