server:
  port: 18080
spring:
  # Gateway 使用 WebFlux；保留 Servlet 依赖时要采用 Reactive 应用类型。
  main:
    web-application-type: reactive
  application:
    name: lien-gateway
  profiles:
    active: ${RUN_ENV}
  # 在 nacos 的 frameworkjava-${RUN_ENV} 空间下的寻找名为 lien-gateway-${RUN_ENV} 的 yaml 配置文件
