spring:
  application:
    name: lien-file
  profiles:
    active: ${RUN_ENV}
  # 在 nacos 的 frameworkjava-${RUN_ENV} 空间下的寻找名为 lien-file-${RUN_ENV} 的 yaml 配置文件
  cloud:
    nacos:
      discovery:
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
      config:
        username: ${NACOS_USERNAME}
        password: ${NACOS_PASSWORD}
        namespace: frameworkjava-${RUN_ENV}
        server-addr: ${NACOS_ADDR}
        file-extension: yaml

logging:
  pattern:
    console: '[%thread] %-5level %logger{36} - %msg%n'
